<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover membuat halaman memakai seluruh layar termasuk area
         di balik notch dan indikator home. Konsekuensinya, jarak aman harus
         diatur sendiri lewat env(safe-area-inset-*) di index.css — tanpa itu
         tab bar bawah akan tertutup indikator home di iPhone.
         maximum-scale dan user-scalable sengaja TIDAK dipakai: mematikan zoom
         menghalangi orang yang butuh memperbesar teks. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>plannersm | Ruang gerak tim kreatif</title>
    <meta
      name="description"
      content="Perencana konten untuk tim media sosial dan agensi. Rencanakan, jadwalkan, dan bagi tugas dalam satu tempat."
    />

    <!-- ===== Kartu tautan saat dibagikan =====
         Tanpa ini, tautan plannersm.co yang dikirim lewat WhatsApp atau
         ditempel di Instagram muncul sebagai teks polos tanpa gambar. Untuk
         produk yang pembelinya justru orang media sosial, itu kesan pertama
         yang buruk dan gratis untuk diperbaiki.

         Gambarnya 1200x630 — ukuran yang dipakai hampir semua platform.
         URL-nya harus mutlak (bukan /og-...), karena yang mengambilnya
         adalah server WhatsApp/Facebook, bukan browser pengunjung. -->
    <link rel="canonical" href="https://plannersm.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="plannersm.co" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:url" content="https://plannersm.co/" />
    <meta property="og:title" content="plannersm.co — Ide boleh ke mana saja, kerjanya tetap tertata" />
    <meta
      property="og:description"
      content="Perencana konten untuk tim media sosial dan agensi. Susun agenda, bagi tugas, dan kumpulkan persetujuan klien dalam satu tempat."
    />
    <meta property="og:image" content="https://plannersm.co/og-plannersm.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="plannersm.co — perencana konten untuk tim media sosial" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="plannersm.co — Ide boleh ke mana saja, kerjanya tetap tertata" />
    <meta
      name="twitter:description"
      content="Perencana konten untuk tim media sosial dan agensi. Susun agenda, bagi tugas, dan kumpulkan persetujuan klien dalam satu tempat."
    />
    <meta name="twitter:image" content="https://plannersm.co/og-plannersm.png" />

    <!-- ===== Penanda terstruktur untuk mesin pencari =====
         Organization memberi tahu Google siapa pemilik layanan ini, dan
         SoftwareApplication menjelaskan apa yang dijual beserta harga
         termurahnya. Angka di sini harus selalu sama dengan yang ada di
         tabel paket_langganan — kalau harga di database naik, ubah juga
         di sini, karena harga yang berbeda antara hasil pencarian dan
         halaman aslinya membuat orang merasa tertipu. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://plannersm.co/#organisasi",
            "name": "World Gate Project",
            "legalName": "PT Wolka Group Palmedia",
            "url": "https://plannersm.co/",
            "logo": "https://plannersm.co/icon-512.png",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Gedung Wirausaha Lt. 1 Unit 104, Jl. H.R. Rasuna Said Kav. C-5",
              "addressLocality": "Jakarta Selatan",
              "addressRegion": "DKI Jakarta",
              "postalCode": "12920",
              "addressCountry": "ID"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+62-851-1103-7992",
              "email": "halo@plannersm.co",
              "contactType": "customer support",
              "availableLanguage": ["id", "en"]
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "plannersm.co",
            "url": "https://plannersm.co/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://plannersm.co/#organisasi" },
            "description": "Perencana konten untuk tim media sosial dan agensi: agenda konten, brief, pembagian tugas, dan persetujuan klien.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "IDR",
              "description": "Paket Gratis tersedia tanpa kartu kredit."
            }
          }
        ]
      }
    </script>

    <!-- ===== Progressive Web App ===== -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Warna bilah status. Dua nilai supaya mode gelap perangkat tidak
         menampilkan bilah putih yang menyilaukan. -->
    <meta name="theme-color" content="#5935D5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5935D5" media="(prefers-color-scheme: dark)" />

    <!-- iOS tidak membaca manifest untuk hal-hal ini, jadi harus ditulis
         terpisah. Tanpa apple-mobile-web-app-capable, aplikasi yang dipasang
         ke home screen tetap terbuka di dalam Safari lengkap dengan bilah
         alamatnya, dan rasanya langsung kembali seperti situs biasa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="plannersm" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/brand/plannersm-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Inter dan Inter Tight untuk halaman depan publik.
         Inter Tight khusus judul besar: hurufnya lebih rapat, jadi judul
         setinggi 78 piksel tidak terlihat renggang. Aplikasi di dalamnya
         tetap memakai font sistem, yang lebih cepat dan tidak perlu
         menunggu unduhan.
         display=swap supaya teks langsung terbaca memakai font sistem
         sambil fontnya dimuat, bukan halaman kosong dulu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Ionicons v7 (https://ionic.io/ionicons). Dipakai lewat web component
         <ion-icon name="..."> — dibungkus komponen src/components/Icon.jsx
         supaya penulisannya seragam di seluruh aplikasi. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
